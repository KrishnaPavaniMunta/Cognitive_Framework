metadata:
  title: Hospital Object Approximate Dimensions
  units: meters
  purpose: Reference sizes for RGB-D validation, false-positive filtering, and scene reasoning.
  note: Values are approximate indoor hospital object sizes and should be tuned against site-specific camera data.

